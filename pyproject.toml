[project]
name = "mvtsad"
version = "0.1.0"
description = "Verifiable fault diagnosis benchmark: scene generator, evidence extractor, claim checker"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
train = [
    "mlx-lm>=0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvtsad"]
